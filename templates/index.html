<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Document to PDF Converter</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); width: 100%; max-width: 600px; padding: 30px; }
    h1 { color: #2c3e50; font-size: 24px; margin-top: 0; text-align: center; }
    p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #34495e; }
    textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; resize: vertical; font-size: 14px; }
    input[type="file"] { display: block; width: 100%; padding: 10px; border: 1px dashed #4a90e2; border-radius: 6px; background: #f0f7ff; cursor: pointer; }
    .divider { text-align: center; margin: 20px 0; font-weight: bold; color: #aaa; position: relative; }
    .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 42%; height: 1px; background: #ddd; }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    button { width: 100%; background: #4a90e2; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #357abd; }
    .alert { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📄 Document to PDF Converter</h1>
    <p class="subtitle">Convert raw text, Word (.docx), or Excel (.xlsx, .csv) files directly into clean PDF documents.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label for="raw_text">Option 1: Paste Plain Text</label>
        <textarea id="raw_text" name="raw_text" placeholder="Type or paste text here..."></textarea>
      </div>

      <div class="divider">OR</div>

      <div class="form-group">
        <label for="file">Option 2: Upload Document / Spreadsheet</label>
        <input type="file" id="file" name="file" accept=".txt,.docx,.xlsx,.xls,.csv">
      </div>

      <button type="submit">Convert & Download PDF</button>
    </form>
  </div>
</body>
</html>
